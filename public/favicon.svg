<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Dark background -->
  <rect width="64" height="64" rx="14" fill="#0B0B0B"/>
  <!-- Neon cyan accent border -->
  <rect x="2" y="2" width="60" height="60" rx="12" stroke="#00F0FF" stroke-width="2" fill="none" opacity="0.5"/>
  <!-- "W" letter -->
  <text
    x="32"
    y="44"
    font-family="Inter, Arial, sans-serif"
    font-size="30"
    font-weight="800"
    text-anchor="middle"
    fill="#00F0FF"
    letter-spacing="-1"
  >WA</text>
  <!-- Subtle bottom glow line -->
  <line x1="16" y1="52" x2="48" y2="52" stroke="#00F0FF" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
</svg>